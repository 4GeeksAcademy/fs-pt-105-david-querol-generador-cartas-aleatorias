<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME OF CARDS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" hrf="style.css">
  </head>
  <body class="d-flex flex-column justify-content-between align-items-center vh-100">
    <h1 class="text-center text-light pt-5">La carta va a cambiar en: <span id="time">5</span></h1>
    <hr />
    <div id="carta" class="card shadow">
      <div class="px-3 text-start just"><div class="suit"></div></div>
      <div class="text-center number"></div>
      <div class="px-3 text-end"><div class="suit rotate"></div></div>
    </div>
    <hr  />
    <button class="btn btn-primary" id="button">Generar Cambio</button>
    <hr />
    <div class="row g-3 pb-5">
      <div class="col-6">
        <label class="text-light text-center">
          <a>card width:</a>            
          <input type="number" class="form-control txt-end" id="card-widht" placeholder="width" value="300" />
        </label>
      </div>
      <div class="col-6">
        <label class="text-light text-center">
          <a>card width:</a>            
          <input type="number" class="form-control txt-end" id="card-height" placeholder="height" value="400" />
        </label>
      </div>
    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
